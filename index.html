<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b5bd6"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest">
<title>Suivi de mes livres — V2</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f5f6f8;color:#20242a}
header{background:white;border-bottom:1px solid #ddd;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:3}
.wrap{max-width:1300px;margin:auto;padding:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button{border:1px solid #d5d9df;background:white;border-radius:8px;padding:9px 13px;cursor:pointer}
button.primary{background:#5b5bd6;color:white;border-color:#5b5bd6}
.nav button.active{background:#5b5bd6;color:white}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid #e1e4e8;border-radius:12px;padding:16px}
.metric{font-size:25px;font-weight:700;margin-top:5px}.muted{color:#68707a;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:240px;padding:10px;border:1px solid #ccd1d7;border-radius:8px}
table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid #e6e8eb;text-align:left;font-size:14px}th{background:#fafbfc}
.pill{background:#eef0f3;border-radius:99px;padding:4px 8px;font-size:12px;display:inline-block;margin:2px}
.green{color:#18794e}.empty{text-align:center;color:#68707a;padding:30px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}
.modalbox{background:white;border-radius:14px;padding:20px;width:min(760px,100%);max-height:90vh;overflow:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:14px}
input,select,textarea{padding:10px;border:1px solid #ccd1d7;border-radius:8px;font:inherit}
.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{background:#f4f5f7;padding:8px;border-radius:8px}
.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.notice{background:#fff8e8;border:1px solid #f1d99b;border-radius:10px;padding:12px;margin:12px 0}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><b>📚 Suivi de mes livres — V2</b><button class="primary" onclick="openBook()">+ Ajouter un livre</button></header>
<div class="wrap">
<nav class="nav">
<button class="active" onclick="tab('dash',this)">📊 Tableau de bord</button>
<button onclick="tab('books',this)">📚 Mes livres</button>
<button onclick="tab('purchases',this)">🛒 Achats</button>
<button onclick="tab('sales',this)">💰 Ventes</button>
</nav>
<section id="dash"></section><section id="books" style="display:none"></section>
<section id="purchases" style="display:none"></section><section id="sales" style="display:none"></section>
</div>

<div class="modal" id="bookModal"><div class="modalbox"><h2>📚 Livre</h2>
<form id="bookForm" class="form">
<input type="hidden" id="bookId">
<label>Titre*<input id="bTitle" required></label><label>Auteur<input id="bAuthor"></label>
<label>ISBN<input id="bIsbn"></label><label>État<select id="bCondition"><option>Très bon</option><option>Bon</option><option>Correct</option><option>Comme neuf</option><option>Abîmé</option></select></label>
<label>Prix d'achat (€)<input id="bBuy" type="number" min="0" step=".01"></label>
<label>Frais d'achat (€)<input id="bBuyFee" type="number" min="0" step=".01" value="0"></label>
<label>Prix de vente souhaité (€)<input id="bWanted" type="number" min="0" step=".01"></label>
<label>Statut<select id="bStatus"><option>À mettre en vente</option><option>En vente</option><option>En attente</option><option>Vendu</option><option>Retiré</option><option>À identifier</option></select></label>
<div class="full"><span class="muted">Plateformes</span><div class="checks">
<label><input type="checkbox" class="plat" value="Vinted"> Vinted</label>
<label><input type="checkbox" class="plat" value="Leboncoin"> Leboncoin</label>
<label><input type="checkbox" class="plat" value="Le Bouquin Français"> Le Bouquin Français</label>
<label><input type="checkbox" class="plat" value="Book Village"> Book Village</label>
<label><input type="checkbox" class="plat" value="Autre"> Autre</label></div></div>
<label class="full">Notes<textarea id="bNotes" rows="3"></textarea></label>
<div class="footer full"><button type="button" onclick="closeBook()">Annuler</button><button class="primary">Enregistrer</button></div>
</form></div></div>

<div class="modal" id="purchaseModal"><div class="modalbox"><h2>🛒 Nouvel achat</h2>
<form id="purchaseForm" class="form">
<label>Type<select id="pType" onchange="togglePurchase()"><option>Individuel</option><option>Lot</option></select></label>
<label>Date<input id="pDate" type="date"></label>
<label>Particulier / vendeur<input id="pSeller" placeholder="Facultatif"></label>
<label>Prix payé (€)<input id="pPrice" type="number" min="0" step=".01" required></label>
<label>Frais (€)<input id="pFee" type="number" min="0" step=".01" value="0"></label>
<div id="lotFields" class="full" style="display:none"><label>Nombre de livres dans le lot<input id="pCount" type="number" min="1" step="1" placeholder="Ex. 35"></label>
<div class="notice">Le coût total sera réparti entre les livres. Exemple : 90 € pour 35 livres = 2,57 € par livre en répartition équitable.</div></div>
<label class="full">Notes<textarea id="pNotes" rows="3"></textarea></label>
<div class="footer full"><button type="button" onclick="closePurchase()">Annuler</button><button type="button" class="primary" onclick="savePurchase()">Enregistrer l'achat</button></div>
</form></div></div>

<div class="modal" id="saleModal"><div class="modalbox"><h2>💰 Enregistrer une vente</h2>
<form id="saleForm" class="form">
<input type="hidden" id="sBook">
<label>Plateforme<select id="sPlatform"><option>Vinted</option><option>Leboncoin</option><option>Le Bouquin Français</option><option>Book Village</option><option>Autre</option></select></label>
<label>Prix réellement vendu (€)<input id="sPrice" type="number" min="0" step=".01" required></label>
<label>Frais de vente (€)<input id="sFee" type="number" min="0" step=".01" value="0"></label>
<label>Date<input id="sDate" type="date"></label>
<div class="footer full"><button type="button" onclick="closeSale()">Annuler</button><button class="primary">Enregistrer la vente</button></div>
</form></div></div>

<script>
const KEY='livresV2';
let db=JSON.parse(localStorage.getItem(KEY)||'{"books":[],"sales":[],"purchases":[]}');
db.books=db.books||[];db.sales=db.sales||[];db.purchases=db.purchases||[];
const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(+n||0);
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function tab(id,btn){['dash','books','purchases','sales'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function render(){renderDash();renderBooks();renderPurchases();renderSales()}
function renderDash(){
 let stock=db.books.filter(b=>!['Vendu','Retiré'].includes(b.status));
 let inv=stock.reduce((a,b)=>a+(+b.buy||0)+(+b.buyFee||0),0),want=stock.reduce((a,b)=>a+(+b.wanted||0),0);
 let ca=db.sales.reduce((a,s)=>a+(+s.price||0),0);
 let mar=db.sales.reduce((a,s)=>a+(+s.price||0)-(+s.fee||0)-(+s.buy||0)-(+s.buyFee||0),0);
 document.getElementById('dash').innerHTML=`<div class="cards">
 <div class="card"><div class="muted">Livres en stock</div><div class="metric">${stock.length}</div></div>
 <div class="card"><div class="muted">Investi dans le stock</div><div class="metric">${money(inv)}</div></div>
 <div class="card"><div class="muted">Prix de vente souhaités</div><div class="metric">${money(want)}</div></div>
 <div class="card"><div class="muted">Marge potentielle</div><div class="metric">${money(want-inv)}</div></div></div>
 <div class="cards" style="margin-top:12px"><div class="card"><div class="muted">Ventes</div><div class="metric">${db.sales.length}</div></div>
 <div class="card"><div class="muted">Chiffre d'affaires</div><div class="metric">${money(ca)}</div></div>
 <div class="card"><div class="muted">Marge réelle</div><div class="metric">${money(mar)}</div></div>
 <div class="card"><div class="muted">Achats</div><div class="metric">${db.purchases.length}</div></div></div>
 <div class="card" style="margin-top:12px"><b>Gestion des achats</b><p class="muted">Tu peux maintenant enregistrer un achat individuel ou un lot acheté à un particulier. Pour un lot, le coût par livre est calculé à titre indicatif ; la prochaine étape pourra permettre de l'attribuer livre par livre.</p></div>`;
}
function renderBooks(){
 let q=(document.getElementById('q')?.value||'').toLowerCase();
 let arr=db.books.filter(b=>(b.title+' '+b.author+' '+b.isbn).toLowerCase().includes(q));
 document.getElementById('books').innerHTML=`<div class="toolbar"><input id="q" placeholder="🔎 Titre, auteur, ISBN..." value="${esc(q)}" oninput="renderBooks()"><button class="primary" onclick="openBook()">+ Ajouter</button></div>
 <div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Livre</th><th>Coût</th><th>Souhaité</th><th>Plateformes</th><th>Marge potentielle</th><th>Statut</th><th></th></tr></thead><tbody>
 ${arr.length?arr.map(b=>`<tr><td><b>${esc(b.title)}</b><div class="muted">${esc(b.author)}</div></td><td>${money((+b.buy||0)+(+b.buyFee||0))}</td><td>${money(b.wanted)}</td><td>${(b.platforms||[]).map(p=>`<span class="pill">${esc(p)}</span>`).join(' ')||'—'}</td><td class="green">${money((+b.wanted||0)-(+b.buy||0)-(+b.buyFee||0))}</td><td>${esc(b.status)}</td><td><button onclick="openBook('${b.id}')">Modifier</button> ${b.status!=='Vendu'?`<button onclick="openSale('${b.id}')">Vendre</button>`:''}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">Aucun livre.</td></tr>`}
 </tbody></table></div>`;
}
function openBook(id=''){let b=db.books.find(x=>x.id===id);document.getElementById('bookModal').classList.add('open');bookId.value=id;bTitle.value=b?.title||'';bAuthor.value=b?.author||'';bIsbn.value=b?.isbn||'';bCondition.value=b?.condition||'Très bon';bBuy.value=b?.buy??'';bBuyFee.value=b?.buyFee??0;bWanted.value=b?.wanted??'';bStatus.value=b?.status||'À mettre en vente';bNotes.value=b?.notes||'';document.querySelectorAll('.plat').forEach(x=>x.checked=b?.platforms?.includes(x.value)||false)}
function closeBook(){document.getElementById('bookModal').classList.remove('open')}
bookForm.onsubmit=e=>{e.preventDefault();let id=bookId.value||crypto.randomUUID();let b={id,title:bTitle.value.trim(),author:bAuthor.value.trim(),isbn:bIsbn.value.trim(),condition:bCondition.value,buy:+bBuy.value||0,buyFee:+bBuyFee.value||0,wanted:+bWanted.value||0,status:bStatus.value,platforms:[...document.querySelectorAll('.plat:checked')].map(x=>x.value),notes:bNotes.value};let i=db.books.findIndex(x=>x.id===id);i<0?db.books.push(b):db.books[i]={...db.books[i],...b};save();closeBook();render()}
function openPurchase(){purchaseModal.classList.add('open');pType.value='Individuel';pDate.value=new Date().toISOString().slice(0,10);pSeller.value='';pPrice.value='';pFee.value=0;pCount.value='';pNotes.value='';togglePurchase()}
function closePurchase(){purchaseModal.classList.remove('open')}
function togglePurchase(){lotFields.style.display=pType.value==='Lot'?'block':'none'}
function savePurchase(){
 let price=+pPrice.value||0,fee=+pFee.value||0,type=pType.value;
 let p={id:crypto.randomUUID(),type,date:pDate.value,seller:pSeller.value.trim()||'Particulier',price,fee,total:price+fee,notes:pNotes.value.trim(),bookIds:[],bookCount:type==='Lot'?(+pCount.value||0):1};
 if(type==='Individuel'){
   let title=prompt('Titre du livre acheté (tu pourras le compléter ensuite) :','');
   if(title===null)return;
   let b={id:crypto.randomUUID(),title:title.trim()||'Livre à identifier',author:'',isbn:'',condition:'Très bon',buy:price,buyFee:fee,wanted:0,status:'À mettre en vente',platforms:[],notes:'',purchaseId:p.id};
   db.books.push(b);p.bookIds.push(b.id);
 } else {
   if(!p.bookCount){alert('Indique le nombre de livres dans le lot.');return}
 }
 db.purchases.push(p);save();closePurchase();render()
}
function renderPurchases(){
 document.getElementById('purchases').innerHTML=`<div class="cards">
 <div class="card"><div class="muted">Achats</div><div class="metric">${db.purchases.length}</div></div>
 <div class="card"><div class="muted">Individuels</div><div class="metric">${db.purchases.filter(p=>p.type==='Individuel').length}</div></div>
 <div class="card"><div class="muted">Lots</div><div class="metric">${db.purchases.filter(p=>p.type==='Lot').length}</div></div>
 <div class="card"><div class="muted">Total dépensé</div><div class="metric">${money(db.purchases.reduce((s,p)=>s+(+p.total||0),0))}</div></div></div>
 <div class="toolbar"><button class="primary" onclick="openPurchase()">+ Nouvel achat</button></div>
 <div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Date</th><th>Type</th><th>Vendeur</th><th>Livres</th><th>Total</th><th></th></tr></thead><tbody>
 ${db.purchases.length?db.purchases.slice().reverse().map(p=>{let n=p.type==='Lot'?p.bookCount:(p.bookIds||[]).length;let per=n?p.total/n:0;return `<tr><td>${esc(p.date)}</td><td><span class="pill">${esc(p.type)}</span></td><td>${esc(p.seller)}</td><td>${n||1}${p.type==='Lot'&&p.bookIds?.length?` (${p.bookIds.length} saisis)`:''}</td><td>${money(p.total)}${p.type==='Lot'?`<div class="muted">${money(per)}/livre si réparti équitablement</div>`:''}</td><td><button onclick="showPurchase('${p.id}')">Détails</button></td></tr>`}).join(''):`<tr><td colspan="6" class="empty">Aucun achat enregistré.</td></tr>`}
 </tbody></table></div>`;
}
function showPurchase(id){let p=db.purchases.find(x=>x.id===id);if(!p)return;let n=p.type==='Lot'?p.bookCount:(p.bookIds||[]).length;let per=n?p.total/n:0;let books=db.books.filter(b=>(p.bookIds||[]).includes(b.id));alert(`${p.type} — ${p.date}\nVendeur : ${p.seller}\nTotal : ${money(p.total)}\n${p.type==='Lot'?`Nombre de livres : ${n}\nRépartition équitable : ${money(per)} / livre`:''}\nLivres déjà créés : ${books.length}${books.length?'\n\n'+books.map(b=>'• '+b.title).join('\n'):''}`)}
function openSale(id){let b=db.books.find(x=>x.id===id);saleModal.classList.add('open');sBook.value=id;sPlatform.value=b?.platforms?.[0]||'Vinted';sPrice.value=b?.wanted||'';sFee.value=0;sDate.value=new Date().toISOString().slice(0,10)}
function closeSale(){saleModal.classList.remove('open')}
saleForm.onsubmit=e=>{e.preventDefault();let b=db.books.find(x=>x.id===sBook.value);let s={id:crypto.randomUUID(),bookId:b.id,title:b.title,platform:sPlatform.value,price:+sPrice.value||0,fee:+sFee.value||0,date:sDate.value,buy:b.buy||0,buyFee:b.buyFee||0};db.sales.push(s);b.status='Vendu';save();closeSale();render()}
function renderSales(){document.getElementById('sales').innerHTML=`<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Livre</th><th>Plateforme</th><th>Date</th><th>Souhaité</th><th>Vendu</th><th>Frais</th><th>Marge</th></tr></thead><tbody>${db.sales.length?db.sales.map(s=>{let b=db.books.find(x=>x.id===s.bookId);return `<tr><td>${esc(s.title)}</td><td>${esc(s.platform)}</td><td>${esc(s.date)}</td><td>${money(b?.wanted||0)}</td><td>${money(s.price)}</td><td>${money(s.fee)}</td><td class="green">${money(+s.price-+s.fee-+s.buy-+s.buyFee)}</td></tr>`}).join(''):`<tr><td colspan="7" class="empty">Aucune vente.</td></tr>`}</tbody></table></div>`}
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body></html>
